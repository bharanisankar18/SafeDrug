<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" width="960" height="980" font-family="Roboto, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7BD84A"/>
    </marker>
    <linearGradient id="cyl" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#16202A"/>
      <stop offset="0.5" stop-color="#1E2C3A"/>
      <stop offset="1" stop-color="#16202A"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1F2C18"/>
      <stop offset="1" stop-color="#18210F"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#232423"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="960" height="980" rx="20" fill="#131313"/>
  <rect width="960" height="980" rx="20" fill="url(#grid)"/>

  <!-- title -->
  <text x="480" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#ECECEC">SafeDose Architecture</text>
  <text x="480" y="76" text-anchor="middle" font-size="14" fill="#A3A3A3">From raw FDA reports to an interactive safety dashboard</text>

  <!-- layer labels (left) -->
  <g font-size="11" font-weight="700" letter-spacing="1.2">
    <text x="36" y="150" fill="#E8A23A">DATASET</text>
    <text x="36" y="166" fill="#6E6E6E" font-weight="400" letter-spacing="0">raw input files</text>
    <text x="36" y="268" fill="#5AA9E6">HADOOP STORAGE</text>
    <text x="36" y="284" fill="#6E6E6E" font-weight="400" letter-spacing="0">file system layer</text>
    <text x="36" y="380" fill="#7BD84A">SPARK COMPUTE</text>
    <text x="36" y="396" fill="#6E6E6E" font-weight="400" letter-spacing="0">preprocessing</text>
    <text x="36" y="474" fill="#5AA9E6">HADOOP STORAGE</text>
    <text x="36" y="490" fill="#6E6E6E" font-weight="400" letter-spacing="0">columnar tables</text>
    <text x="36" y="540" fill="#7BD84A">SPARK COMPUTE</text>
    <text x="36" y="556" fill="#6E6E6E" font-weight="400" letter-spacing="0">analysis</text>
    <text x="36" y="800" fill="#E5534B">PRESENTATION</text>
    <text x="36" y="816" fill="#6E6E6E" font-weight="400" letter-spacing="0">web dashboard</text>
  </g>

  <!-- ===== connectors ===== -->
  <g stroke="#7BD84A" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="480" y1="196" x2="480" y2="228"/>
    <line x1="480" y1="318" x2="480" y2="344"/>
    <line x1="480" y1="424" x2="480" y2="450"/>
    <path d="M480 538 V552 H153 V580"/>
    <path d="M480 552 H371 V580"/>
    <path d="M480 552 H589 V580"/>
    <path d="M480 552 H807 V580"/>
    <line x1="480" y1="716" x2="480" y2="746"/>
  </g>
  <g stroke="#7BD84A" stroke-width="2" fill="none">
    <path d="M153 694 V716 H807 V694"/>
    <path d="M371 694 V716"/>
    <path d="M589 694 V716"/>
  </g>

  <!-- ===== 1. openFDA: stack of documents ===== -->
  <g stroke="#E8A23A" stroke-width="1.5">
    <path d="M346 124 H606 L626 144 V196 H346 Z" fill="#1B1A16" opacity="0.55"/>
    <path d="M340 118 H600 L620 138 V190 H340 Z" fill="#1E1C17" opacity="0.8"/>
    <path d="M334 112 H594 L614 132 V184 H334 Z" fill="#221F18"/>
    <path d="M594 112 V132 H614" fill="none"/>
  </g>
  <text x="474" y="144" text-anchor="middle" font-size="18" font-weight="700" fill="#ECECEC">openFDA Reports</text>
  <text x="474" y="168" text-anchor="middle" font-size="13" fill="#A3A3A3">3 JSON files · about 1.7 GB · FDA FAERS</text>

  <!-- ===== 2. Hadoop: cylinder ===== -->
  <g stroke="#5AA9E6" stroke-width="1.5">
    <path d="M330 246 V302 A150 14 0 0 0 630 302 V246" fill="url(#cyl)"/>
    <ellipse cx="480" cy="246" rx="150" ry="14" fill="#223447"/>
  </g>
  <text x="480" y="284" text-anchor="middle" font-size="18" font-weight="700" fill="#ECECEC">Hadoop FileSystem</text>
  <text x="480" y="306" text-anchor="middle" font-size="13" fill="#A3A3A3">opens and reads the big files from disk</text>

  <!-- ===== 3. Spark clean: hexagon (process) ===== -->
  <polygon points="322,387 352,350 608,350 638,387 608,424 352,424" fill="url(#hex)" stroke="#4DB51F" stroke-width="1.5"/>
  <text x="480" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#ECECEC">Apache Spark · Clean</text>
  <text x="480" y="404" text-anchor="middle" font-size="13" fill="#A3A3A3">remove duplicates · fix drug &amp; reaction names</text>

  <!-- ===== 4. Parquet: cylinder ===== -->
  <g stroke="#5AA9E6" stroke-width="1.5">
    <path d="M330 468 V524 A150 14 0 0 0 630 524 V468" fill="url(#cyl)"/>
    <ellipse cx="480" cy="468" rx="150" ry="14" fill="#223447"/>
  </g>
  <text x="480" y="506" text-anchor="middle" font-size="18" font-weight="700" fill="#ECECEC">Parquet Tables</text>
  <text x="480" y="528" text-anchor="middle" font-size="13" fill="#A3A3A3">small &amp; fast · about 8 MB · 377,130 rows</text>

  <!-- ===== 5–8. analysis cards ===== -->
  <g stroke-width="1.5">
    <rect x="58"  y="584" width="190" height="110" rx="12" fill="#1B1B1B" stroke="#E5534B"/>
    <rect x="276" y="584" width="190" height="110" rx="12" fill="#1B1B1B" stroke="#A78BFA"/>
    <rect x="494" y="584" width="190" height="110" rx="12" fill="#1B1B1B" stroke="#4DB51F"/>
    <rect x="712" y="584" width="190" height="110" rx="12" fill="#1B1B1B" stroke="#E8A23A"/>
  </g>
  <!-- top accent bars -->
  <g>
    <rect x="58" y="583" width="166" height="4" rx="2" transform="translate(12 0)" fill="#E5534B"/>
    <rect x="276" y="583" width="166" height="4" rx="2" transform="translate(12 0)" fill="#A78BFA"/>
    <rect x="494" y="583" width="166" height="4" rx="2" transform="translate(12 0)" fill="#4DB51F"/>
    <rect x="712" y="583" width="166" height="4" rx="2" transform="translate(12 0)" fill="#E8A23A"/>
  </g>
  <!-- mini icons -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- warning triangle -->
    <path d="M153 600 L165 620 H141 Z" stroke="#E5534B"/>
    <line x1="153" y1="607" x2="153" y2="613" stroke="#E5534B"/>
    <!-- linked nodes -->
    <circle cx="362" cy="611" r="5" stroke="#A78BFA"/><circle cx="380" cy="611" r="5" stroke="#A78BFA"/>
    <line x1="367" y1="611" x2="375" y2="611" stroke="#A78BFA"/>
    <!-- spike line -->
    <polyline points="575,618 581,614 587,616 591,600 595,616 603,612" stroke="#4DB51F"/>
    <!-- map → reduce -->
    <path d="M795 603 H805 M795 611 H805 M795 619 H805 M807 603 L815 611 L807 619 M815 611 H821" stroke="#E8A23A"/>
  </g>
  <g text-anchor="middle">
    <text x="153" y="644" font-size="15" font-weight="700" fill="#ECECEC">Safety Signals</text>
    <text x="153" y="664" font-size="12" fill="#A3A3A3">PRR · ROR · Chi-square</text>
    <text x="153" y="684" font-size="12" font-weight="700" fill="#E5534B">27,860 signals</text>

    <text x="371" y="644" font-size="15" font-weight="700" fill="#ECECEC">Drug Combos</text>
    <text x="371" y="664" font-size="12" fill="#A3A3A3">Spark MLlib FP-Growth</text>
    <text x="371" y="684" font-size="12" font-weight="700" fill="#A78BFA">561 pairs</text>

    <text x="589" y="644" font-size="15" font-weight="700" fill="#ECECEC">Trends &amp; Spikes</text>
    <text x="589" y="664" font-size="12" fill="#A3A3A3">monthly Z-score</text>
    <text x="589" y="684" font-size="12" font-weight="700" fill="#7BD84A">179 spikes</text>

    <text x="807" y="644" font-size="15" font-weight="700" fill="#ECECEC">MapReduce</text>
    <text x="807" y="664" font-size="12" fill="#A3A3A3">map · shuffle · reduce</text>
    <text x="807" y="684" font-size="12" font-weight="700" fill="#E8A23A">key → value counts</text>
  </g>

  <!-- ===== 9. dashboard: browser window ===== -->
  <rect x="230" y="750" width="500" height="132" rx="12" fill="#1B1B1B" stroke="#E5534B" stroke-width="1.5"/>
  <path d="M230 762 A12 12 0 0 1 242 750 H718 A12 12 0 0 1 730 762 V778 H230 Z" fill="#222322"/>
  <line x1="230" y1="778" x2="730" y2="778" stroke="#3A3B3A"/>
  <circle cx="250" cy="764" r="5" fill="#E5534B"/>
  <circle cx="266" cy="764" r="5" fill="#E8A23A"/>
  <circle cx="282" cy="764" r="5" fill="#4DB51F"/>
  <rect x="380" y="756" width="200" height="16" rx="8" fill="#131313" stroke="#3A3B3A"/>
  <text x="480" y="768" text-anchor="middle" font-size="10.5" fill="#A3A3A3" font-family="Roboto Mono, Consolas, monospace">localhost:8501</text>
  <text x="480" y="808" text-anchor="middle" font-size="18" font-weight="700" fill="#ECECEC">Streamlit Dashboard</text>
  <!-- page chips -->
  <g font-size="11" fill="#A3A3A3" text-anchor="middle">
    <rect x="250" y="822" width="74" height="22" rx="11" fill="#222322" stroke="#3A3B3A"/><text x="287" y="837">Overview</text>
    <rect x="330" y="822" width="96" height="22" rx="11" fill="#222322" stroke="#3A3B3A"/><text x="378" y="837">Drug Explorer</text>
    <rect x="432" y="822" width="96" height="22" rx="11" fill="#222322" stroke="#3A3B3A"/><text x="480" y="837">Safety Signals</text>
    <rect x="534" y="822" width="96" height="22" rx="11" fill="#222322" stroke="#3A3B3A"/><text x="582" y="837">Compare Drugs</text>
    <rect x="636" y="822" width="74" height="22" rx="11" fill="#222322" stroke="#3A3B3A"/><text x="673" y="837">Trends</text>
    <rect x="340" y="850" width="120" height="22" rx="11" fill="#222322" stroke="#3A3B3A"/><text x="400" y="865">Interaction Network</text>
    <rect x="466" y="850" width="96" height="22" rx="11" fill="#222322" stroke="#3A3B3A"/><text x="514" y="865">Architecture</text>
  </g>

  <!-- ===== step numbers (like the website) ===== -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#131313">
    <circle cx="334" cy="112" r="11" fill="#7BD84A"/><text x="334" y="116">1</text>
    <circle cx="330" cy="246" r="11" fill="#7BD84A"/><text x="330" y="250">2</text>
    <circle cx="322" cy="387" r="11" fill="#7BD84A"/><text x="322" y="391">3</text>
    <circle cx="330" cy="468" r="11" fill="#7BD84A"/><text x="330" y="472">4</text>
    <circle cx="58"  cy="584" r="11" fill="#7BD84A"/><text x="58"  y="588">5</text>
    <circle cx="276" cy="584" r="11" fill="#7BD84A"/><text x="276" y="588">6</text>
    <circle cx="494" cy="584" r="11" fill="#7BD84A"/><text x="494" y="588">7</text>
    <circle cx="712" cy="584" r="11" fill="#7BD84A"/><text x="712" y="588">8</text>
    <circle cx="230" cy="750" r="11" fill="#7BD84A"/><text x="230" y="754">9</text>
  </g>

  <!-- ===== legend ===== -->
  <line x1="40" y1="912" x2="920" y2="912" stroke="#2C2D2C"/>
  <g font-size="12" fill="#A3A3A3">
    <path d="M110 930 H130 L136 936 V950 H110 Z" fill="#221F18" stroke="#E8A23A" stroke-width="1.2"/>
    <text x="144" y="945">Data files</text>

    <path d="M250 934 V948 A14 4 0 0 0 278 948 V934" fill="url(#cyl)" stroke="#5AA9E6" stroke-width="1.2"/>
    <ellipse cx="264" cy="934" rx="14" ry="4" fill="#223447" stroke="#5AA9E6" stroke-width="1.2"/>
    <text x="286" y="945">Storage</text>

    <polygon points="380,940 386,931 404,931 410,940 404,949 386,949" fill="url(#hex)" stroke="#4DB51F" stroke-width="1.2"/>
    <text x="418" y="945">Spark processing</text>

    <rect x="548" y="930" width="26" height="20" rx="4" fill="#1B1B1B" stroke="#A78BFA" stroke-width="1.2"/>
    <text x="582" y="945">Analysis result</text>

    <rect x="704" y="930" width="28" height="20" rx="4" fill="#1B1B1B" stroke="#E5534B" stroke-width="1.2"/>
    <line x1="704" y1="936" x2="732" y2="936" stroke="#E5534B" stroke-width="1.2"/>
    <text x="740" y="945">Dashboard</text>
  </g>
</svg>
