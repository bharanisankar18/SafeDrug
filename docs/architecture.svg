<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="960" height="900" rx="20" fill="#f8fafc"/>

  <!-- title -->
  <text x="480" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">💊 SafeDose Architecture</text>
  <text x="480" y="74" text-anchor="middle" font-size="14" fill="#64748b">From raw FDA reports to an interactive safety dashboard</text>

  <!-- layer labels (left) -->
  <g font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">
    <text x="40" y="132">1 · DATASET</text>
    <text x="40" y="242">2 · HADOOP STORAGE</text>
    <text x="40" y="352">3 · SPARK CLEANING</text>
    <text x="40" y="462">4 · HADOOP STORAGE</text>
    <text x="40" y="548">5 · SPARK ANALYSIS</text>
    <text x="40" y="742">6 · DASHBOARD</text>
  </g>

  <!-- arrows (main spine) -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="480" y1="186" x2="480" y2="214"/>
    <line x1="480" y1="296" x2="480" y2="324"/>
    <line x1="480" y1="406" x2="480" y2="434"/>
    <!-- parquet fans out to 4 analysis boxes -->
    <path d="M480 516 V530 H153 V552"/>
    <path d="M480 516 V530 H371 V552"/>
    <path d="M480 516 V530 H589 V552"/>
    <path d="M480 516 V530 H807 V552"/>
    <!-- analysis boxes back into dashboard -->
    <line x1="480" y1="690" x2="480" y2="714"/>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M153 662 V690 H807 V662"/>
    <path d="M371 662 V690"/>
    <path d="M589 662 V690"/>
  </g>

  <!-- 1. openFDA -->
  <g filter="url(#shadow)">
    <rect x="300" y="110" width="360" height="76" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <text x="480" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">📥 openFDA Reports</text>
  <text x="480" y="166" text-anchor="middle" font-size="13" fill="#334155">3 JSON files · about 1.7 GB · FDA FAERS</text>

  <!-- 2. Hadoop -->
  <g filter="url(#shadow)">
    <rect x="300" y="220" width="360" height="76" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <text x="480" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#155e75">🐘 Hadoop FileSystem</text>
  <text x="480" y="276" text-anchor="middle" font-size="13" fill="#334155">opens and reads the big files from disk</text>

  <!-- 3. Spark clean -->
  <g filter="url(#shadow)">
    <rect x="300" y="330" width="360" height="76" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  </g>
  <text x="480" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">⚡ Apache Spark · Clean</text>
  <text x="480" y="386" text-anchor="middle" font-size="13" fill="#334155">remove duplicates · fix drug &amp; reaction names</text>

  <!-- 4. Parquet -->
  <g filter="url(#shadow)">
    <rect x="300" y="440" width="360" height="76" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  </g>
  <text x="480" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#155e75">📦 Parquet Tables</text>
  <text x="480" y="496" text-anchor="middle" font-size="13" fill="#334155">small &amp; fast · about 8 MB · 377,130 clean rows</text>

  <!-- 5. analysis boxes -->
  <g filter="url(#shadow)">
    <rect x="58"  y="558" width="190" height="104" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <rect x="276" y="558" width="190" height="104" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="494" y="558" width="190" height="104" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect x="712" y="558" width="190" height="104" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="153" y="590" font-size="16" font-weight="700" fill="#991b1b">🚨 Safety Signals</text>
    <text x="153" y="614" font-size="12" fill="#334155">PRR · ROR · Chi-square</text>
    <text x="153" y="640" font-size="12" font-weight="700" fill="#991b1b">27,860 signals</text>

    <text x="371" y="590" font-size="16" font-weight="700" fill="#5b21b6">🔗 Drug Combos</text>
    <text x="371" y="614" font-size="12" fill="#334155">Spark MLlib FP-Growth</text>
    <text x="371" y="640" font-size="12" font-weight="700" fill="#5b21b6">561 pairs</text>

    <text x="589" y="590" font-size="16" font-weight="700" fill="#166534">📈 Trends &amp; Spikes</text>
    <text x="589" y="614" font-size="12" fill="#334155">monthly Z-score</text>
    <text x="589" y="640" font-size="12" font-weight="700" fill="#166534">179 spikes</text>

    <text x="807" y="590" font-size="16" font-weight="700" fill="#854d0e">🧮 MapReduce</text>
    <text x="807" y="614" font-size="12" fill="#334155">classic Hadoop counting</text>
    <text x="807" y="640" font-size="12" font-weight="700" fill="#854d0e">key → value counts</text>
  </g>

  <!-- 6. dashboard -->
  <g filter="url(#shadow)">
    <rect x="240" y="720" width="480" height="96" rx="14" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  </g>
  <text x="480" y="754" text-anchor="middle" font-size="19" font-weight="700" fill="#9f1239">🎈 Streamlit Dashboard</text>
  <text x="480" y="778" text-anchor="middle" font-size="13" fill="#334155">Overview · Drug Explorer · Signals · Compare</text>
  <text x="480" y="798" text-anchor="middle" font-size="13" fill="#334155">Trends · Interaction Network · Architecture</text>

  <!-- footer -->
  <text x="480" y="864" text-anchor="middle" font-size="12" fill="#94a3b8">Charts by Plotly · Network by NetworkX · Open at http://localhost:8501</text>
</svg>
